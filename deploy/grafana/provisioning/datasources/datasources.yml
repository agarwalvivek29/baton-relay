apiVersion: 1

datasources:
  - name: Tempo
    type: tempo
    uid: tempo
    access: proxy
    url: http://tempo:3200
    jsonData:
      httpMethod: GET

  # The log → trace link. A Loki derived field that points at a Tempo
  # datasource runs its url as a TraceQL query (queryType: traceql), so one
  # click searches for EVERY trace whose spans carry this request ID; not a
  # single trace-ID lookup.
  # https://github.com/grafana/grafana-loki-datasource/blob/main/src/getDerivedFields.ts
  # https://github.com/grafana/grafana/blob/v13.2.3/docs/sources/datasources/loki/configure/index.md
  # "$$" escapes "$" in provisioning files.
  - name: Loki
    type: loki
    uid: loki
    access: proxy
    url: http://loki:3100
    isDefault: true
    jsonData:
      derivedFields:
        - name: request_id
          matcherType: regex
          matcherRegex: '"request_id":"([A-Za-z0-9._-]+)"'
          datasourceUid: tempo
          # Request header on every hop; response header on the edge span,
          # where baton created the ID (see obi.yml).
          url: '{ span."http.request.header.x-request-id" = "$${__value.raw}" || span."http.response.header.x-request-id" = "$${__value.raw}" }'
          urlDisplayLabel: "Find every trace for this request"
